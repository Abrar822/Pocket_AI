<svg
  width="45"
  height="45"
  viewBox="0 0 45 45"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="pocketAIGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#e94ff5" />
      <stop offset="30%" stop-color="#b06bff" />
      <stop offset="65%" stop-color="#5b8bff" />
      <stop offset="100%" stop-color="#4fd8ff" />
    </linearGradient>

    <filter
      id="glow"
      x="-80%"
      y="-80%"
      width="260%"
      height="260%"
    >
      <feGaussianBlur
        stdDeviation="1.5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle
    cx="22.5"
    cy="22.5"
    r="18"
    fill="none"
    stroke="url(#pocketAIGradient)"
    stroke-width="3"
    filter="url(#glow)"
  />
</svg>